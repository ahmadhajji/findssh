name: Bug report
description: Report a reproducible problem in FindSSH.
body:
  - type: markdown
    attributes:
      value: "Remove credentials, private hostnames, and personal paths from reports and screenshots. For vulnerabilities, use Security → Report a vulnerability."
  - type: input
    id: environment
    attributes:
      label: Environment
      description: FindSSH version, macOS version, and Apple Silicon or Intel.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Steps using disposable data, what you expected, and what happened instead. Include the exact sanitized error if there is one.
    validations:
      required: true
