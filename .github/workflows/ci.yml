name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y openssh-sftp-server xvfb
      - run: pnpm check
      - run: pnpm format:check
      - run: xvfb-run -a pnpm test:e2e --repeat-each=3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-test-results
          path: test-results/
  mac:
    strategy:
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test:e2e
      - run: pnpm package:mac --${{ matrix.arch }}
      - name: Verify ad hoc signature
        run: bash scripts/verify-mac-signature.sh "release/mac${{ matrix.arch == 'arm64' && '-arm64' || '' }}/FindSSH.app"
      - run: pnpm exec playwright test
        env:
          FINDSSH_EXECUTABLE: ${{ github.workspace }}/release/mac${{ matrix.arch == 'arm64' && '-arm64' || '' }}/FindSSH.app/Contents/MacOS/FindSSH
      - uses: actions/upload-artifact@v4
        with:
          name: mac-preview-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.zip
