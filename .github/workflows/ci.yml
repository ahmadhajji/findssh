name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y openssh-sftp-server xvfb
      - run: pnpm check
      - run: xvfb-run -a pnpm test:e2e --repeat-each=3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-test-results
          path: test-results/
  mac:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test:e2e
      - run: pnpm package:mac --arm64
      - run: pnpm exec playwright test
        env:
          FINDSSH_EXECUTABLE: ${{ github.workspace }}/release/mac-arm64/FindSSH.app/Contents/MacOS/FindSSH
      - uses: actions/upload-artifact@v4
        with:
          name: mac-preview
          path: |
            release/*.dmg
            release/*.zip
